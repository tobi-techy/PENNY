[package]
name = "penny-guard"
description = "Penny Guard: per-user on-chain spending policy for AI agents on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tobi-techy/penny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
members = [".", "mock-ft", "integration-tests"]
