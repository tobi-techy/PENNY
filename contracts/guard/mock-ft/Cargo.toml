[package]
name = "mock-ft"
description = "Penny test dollar (tUSD): NEP-141 + NEP-145 test token for Penny Guard sandbox tests and testnet"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
